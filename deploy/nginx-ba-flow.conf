# nginx reverse proxy. Replace the host name and certificate paths.
# Only the webhook path is public; /health stays internal (curl http://127.0.0.1:8080/health on the server).
server {
    listen 443 ssl;
    server_name baflow.company.com;

    ssl_certificate     /etc/ssl/certs/baflow.company.com.crt;
    ssl_certificate_key /etc/ssl/private/baflow.company.com.key;

    client_max_body_size 1m;

    location = /clickup/webhook {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;          # the service answers immediately; ClickUp gives up after 7s
    }

    location / {
        return 404;
    }
}
