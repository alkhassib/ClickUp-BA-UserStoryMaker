[project]
name = "ba-flow"
version = "0.1.0"
description = "Automates BA gap resolution and User Story ticket creation on ClickUp"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.99",
    "anthropic>=0.70",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
ba-flow = "ba_flow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ba_flow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
